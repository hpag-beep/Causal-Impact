<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Causal Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical, technical instrument for one analyst; no decoration.
   IDEA: a lab protocol binder: numbered steps, each signed off before the next.
   PICTURE: the counterfactual chart (observed vs predicted band) is the core figure.
   COLOUR and TYPE: black ground, light ink, one pale blue accent for the model, red only for flags; Inter Tight + Inter.
   LAYOUT: sticky stepper, one step per view, controls above figures, tables right-aligned. */
:root{color-scheme:dark;
--bg:#000000;--panel:#101214;--ink:#e8eaed;
--muted:#9aa1aa;--line:#262a2f;--accent:#7fb0e0;
--band:rgba(127,176,224,.22);--shade:rgba(232,234,237,.07);
--flag:#ff6b6b;--ok:#6fcf97;--grid:#1a1d21}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;font-weight:600;line-height:1.15;margin:0}
h1{font-size:20px}h2{font-size:24px;margin-bottom:4px}h3{font-size:16px;margin:22px 0 8px}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:13px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px max(3vw,16px);flex-wrap:wrap}
.bar .sp{flex:1}
.steps{display:flex;gap:2px;overflow-x:auto;padding:0 max(3vw,16px)}
.steps a{flex:none;display:flex;flex-direction:column;padding:8px 14px 9px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
.steps a b{font-weight:500;color:var(--ink)}.steps a span{font-size:12px}
.steps a.on{border-bottom-color:var(--accent)}.steps a.on b{color:var(--accent)}
.steps a .st-ok{color:var(--ok)}.steps a .st-warn{color:var(--flag)}
main{max-width:1240px;margin:0 auto;padding:24px max(3vw,16px) 80px}
.lead{max-width:760px;color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px 18px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field.wide{grid-column:1/-1}
input,select,textarea,button{font:inherit;font-size:15px;color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;min-height:40px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
button,.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;min-height:40px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.sec{border-top:1px solid var(--line);margin-top:26px;padding-top:4px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:12.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.warnrow td{background:rgba(255,107,107,.09)}
tr.base td{font-weight:600}
td select{min-height:34px;padding:4px 6px;font-size:13.5px;min-width:150px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--panel);margin:1px 3px 1px 0;white-space:nowrap}
.chip.flag{color:var(--flag);background:rgba(255,107,107,.13)}
.chip.ok{color:var(--ok)}
.flags{list-style:none;padding:0;margin:8px 0}.flags li{padding:4px 0 4px 22px;position:relative;font-size:14px}
.flags li::before{content:"";position:absolute;left:4px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.flags li.warn::before{background:var(--flag)}.flags li.pass::before{background:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin:12px 0}
.tile{background:var(--panel);border-radius:8px;padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--muted)}.tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:end;margin:16px 0 8px}
.hero .big{font:600 clamp(40px,7vw,64px)/1 "Inter Tight",Inter,sans-serif;font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.legend div{padding:8px 10px;border-radius:6px;background:var(--panel);font-size:12.5px;color:var(--muted)}
.legend div b{display:block;color:var(--ink);font-weight:500;font-size:13.5px}
.legend div.cur{outline:2px solid var(--ink);color:var(--ink)}
.fig{position:relative;height:300px;margin:6px 0}.fig.s{height:170px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.6);white-space:nowrap;z-index:2}
.tip b{font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.status{position:fixed;left:0;right:0;bottom:0;background:var(--panel);color:var(--ink);border-top:1px solid var(--line);padding:8px max(3vw,16px);font-size:14px;display:flex;gap:12px;align-items:center;z-index:9}
.status[hidden]{display:none}.status button{background:transparent;color:var(--ink);border-color:var(--line);min-height:32px;padding:4px 10px}
.prog{flex:none;width:140px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0}
.empty{background:var(--panel);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.stale{color:var(--flag);font-size:13px;font-weight:500}
.note{border:1px solid var(--line);border-left:3px solid var(--flag);border-radius:6px;padding:10px 14px;margin:0 0 16px;max-width:760px;font-size:14px}
.top a.btn.on{border-color:var(--ink)}
td.act div{display:flex;flex-direction:column;gap:4px;align-items:stretch}
td.act button{min-height:30px;padding:3px 10px;font-size:13px;justify-content:center}
details.menu{position:relative}details.menu>summary{list-style:none;cursor:pointer}details.menu>summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:46px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;width:min(340px,90vw);box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:6}
.pop .pi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.spark{width:150px;height:28px;color:var(--muted)}
.spark .iv{stroke:var(--accent)}
.kv td:first-child{color:var(--muted);width:230px;font-size:13px}
.kv td{vertical-align:top}
.bar-in{height:8px;background:var(--panel);border-radius:4px;width:110px;display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}.bar-in i{display:block;height:100%;background:var(--accent)}
a{color:var(--accent)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;border-radius:0;background:transparent;color:var(--muted);min-height:38px;padding:6px 11px;font-size:13px;font-weight:500}
.lang button+button{border-left:1px solid var(--line)}.lang button[aria-pressed=true]{background:var(--panel);color:var(--ink)}
.doc{max-width:820px}.doc h3{margin-top:30px;scroll-margin-top:140px}.doc ul,.doc ol{padding-left:22px;margin:8px 0}.doc li{margin:6px 0}
.doc code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:13px}
.toc{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 4px;font-size:14px}
dl.gl{margin:0}.gl-item{padding:10px 0;border-bottom:1px solid var(--line)}.gl-item dt{font-weight:600}.gl-item dd{margin:3px 0 0;color:var(--muted)}
@media(max-width:720px){.top{position:static}.bar{gap:8px}.bar .btn,.bar>button,.lang button{min-height:34px;padding:4px 10px;font-size:14px}.hero{grid-template-columns:1fr}.legend{grid-template-columns:repeat(2,minmax(0,1fr))}.kv td:first-child{width:120px}}
@media(prefers-reduced-motion:no-preference){.prog i{transition:width .2s}}
</style>

<body>
<header class="top">
  <div class="bar">
    <h1>Causal Impact</h1>
    <span class="muted small" id="engv">Engine loading</span>
    <span class="sp"></span>
    <a class="btn" href="#readme" id="readmeBtn">Read me</a>
    <a class="btn" href="#glossary" id="glossBtn">Glossary</a>
    <details class="menu" id="presetMenu"><summary class="btn" id="presetSum">Presets</summary><div class="pop" id="presetPop"></div></details>
    <a class="btn" href="#history" id="histBtn">History</a>
    <button id="newTest" type="button">New test</button>
    <div class="lang" id="langSw" role="group" aria-label="Language / Langue"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="fr" aria-pressed="false">FR</button></div>
  </div>
  <nav class="steps" id="steps"></nav>
</header>
<main id="view"></main>
<div class="status" id="status" hidden><span id="statusText"></span><span class="prog" id="progWrap" hidden><i id="progBar"></i></span><span class="sp" style="flex:1"></span><button type="button" id="cancelJob" hidden>Cancel</button><button type="button" id="closeStatus">Dismiss</button></div>
<script type="text/plain" id="engine-src">// Causal Impact engine: Bayesian structural time series in JavaScript.
// Mirrors the defaults of the R packages CausalImpact (Brodersen et al., 2015) and bsts:
//   * local level, prior SdPrior(prior.level.sd * sdy, sample.size = 32, upper.limit = sdy)
//   * optional seasonal component, prior SdPrior(0.01 * sdy, sample.size = 0.01, upper.limit = sdy)
//   * static regression with spike-and-slab prior: expected.model.size = 3, expected.r2 = 0.8,
//     prior.df = 50, prior.information.weight = 0.01, diagonal.shrinkage = 0.5
//   * data standardised on the pre-period, post-period response set to missing
//   * Durbin-Koopman simulation smoother, Gibbs sampling, 10% burn-in
//   * summary table and one-sided tail probability computed as in CausalImpact
// Runs unchanged in a browser, a Web Worker or Node (ES module, no dependencies).

export const ENGINE_VERSION = '0.2.0';

const DEFAULTS = {
  niter: 1000,
  burnProportion: 0.1,
  priorLevelSd: 0.01,
  nseasons: 7,
  seasonDuration: 1,
  standardize: true,
  alpha: 0.05,
  seed: 1,
  expectedModelSize: 3,
  expectedR2: 0.8,
  priorDf: 50,
  priorInformationWeight: 0.01,
  diagonalShrinkage: 0.5,
  levelPriorSampleSize: 32,
};

// ---------------------------------------------------------------------------
// Random numbers (xoshiro128**, seeded by splitmix32)
// ---------------------------------------------------------------------------
export function makeRng(seed = 1) {
  let s = seed >>> 0;
  const sm = () => {
    s = (s + 0x9e3779b9) >>> 0;
    let z = s;
    z = Math.imul(z ^ (z >>> 16), 0x85ebca6b) >>> 0;
    z = Math.imul(z ^ (z >>> 13), 0xc2b2ae35) >>> 0;
    return (z ^ (z >>> 16)) >>> 0;
  };
  let a = sm(), b = sm(), c = sm(), d = sm();
  const next = () => {
    const r = Math.imul(rotl(Math.imul(b, 5), 7), 9) >>> 0;
    const t = b << 9;
    c ^= a; d ^= b; b ^= c; a ^= d; c ^= t; d = rotl(d, 11);
    return r;
  };
  function rotl(x, k) { return (x << k) | (x >>> (32 - k)); }
  const uniform = () => ((next() >>> 5) * 67108864 + (next() >>> 6) + 0.5) / 9007199254740992; // in (0, 1)
  let spare = null;
  const normal = () => {
    if (spare !== null) { const v = spare; spare = null; return v; }
    let u, v, q;
    do { u = 2 * uniform() - 1; v = 2 * uniform() - 1; q = u * u + v * v; } while (q >= 1 || q === 0);
    const f = Math.sqrt(-2 * Math.log(q) / q);
    spare = v * f;
    return u * f;
  };
  // Gamma(shape, rate) via Marsaglia-Tsang
  const gamma = (shape, rate) => {
    if (shape < 1) return gamma(shape + 1, rate) * Math.pow(uniform(), 1 / shape);
    const dd = shape - 1 / 3, cc = 1 / Math.sqrt(9 * dd);
    for (;;) {
      let x, v;
      do { x = normal(); v = 1 + cc * x; } while (v <= 0);
      v = v * v * v;
      const u = uniform();
      if (u < 1 - 0.0331 * x ** 4 || Math.log(u) < 0.5 * x * x + dd * (1 - v + Math.log(v))) return dd * v / rate;
    }
  };
  return { uniform, normal, gamma };
}

// Regularised lower incomplete gamma P(a, x)
function gammaP(a, x) {
  if (x <= 0) return 0;
  const gln = lgamma(a);
  if (x < a + 1) {
    let ap = a, sum = 1 / a, del = sum;
    for (let n = 0; n < 500; n++) { ap += 1; del *= x / ap; sum += del; if (Math.abs(del) < Math.abs(sum) * 1e-14) break; }
    return sum * Math.exp(-x + a * Math.log(x) - gln);
  }
  let b = x + 1 - a, c = 1e300, d = 1 / b, h = d;
  for (let i = 1; i < 500; i++) {
    const an = -i * (i - a); b += 2;
    d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300;
    c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300;
    d = 1 / d; const del = d * c; h *= del;
    if (Math.abs(del - 1) < 1e-14) break;
  }
  return 1 - Math.exp(-x + a * Math.log(x) - gln) * h;
}
function lgamma(x) {
  const g = 7, coef = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61577655591664, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
  x -= 1; let a = coef[0]; const t = x + g + 0.5;
  for (let i = 1; i < g + 2; i++) a += coef[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

// Draw sigma from the conjugate posterior 1/sigma^2 ~ Gamma(shape, rate), truncated to sigma <= upper.
function drawSigma(rng, shape, rate, upper) {
  for (let k = 0; k < 50; k++) {
    const tau = rng.gamma(shape, rate);
    const s = 1 / Math.sqrt(tau);
    if (s <= upper) return s;
  }
  // inverse CDF on the truncated region tau >= 1/upper^2
  const lo = 1 / (upper * upper);
  const plo = gammaP(shape, rate * lo);
  if (plo >= 1 - 1e-12) return upper;
  const u = plo + (1 - plo) * rng.uniform();
  let a = lo, b = lo * 2;
  while (gammaP(shape, rate * b) < u) b *= 2;
  for (let i = 0; i < 80; i++) { const m = 0.5 * (a + b); if (gammaP(shape, rate * m) < u) a = m; else b = m; }
  return 1 / Math.sqrt(0.5 * (a + b));
}

// ---------------------------------------------------------------------------
// Small dense linear algebra
// ---------------------------------------------------------------------------
function cholesky(A, k) { // A: Float64Array k*k row-major, returns lower L or null
  const L = new Float64Array(k * k);
  for (let i = 0; i < k; i++) {
    for (let j = 0; j <= i; j++) {
      let s = A[i * k + j];
      for (let q = 0; q < j; q++) s -= L[i * k + q] * L[j * k + q];
      if (i === j) { if (s <= 0) return null; L[i * k + i] = Math.sqrt(s); }
      else L[i * k + j] = s / L[j * k + j];
    }
  }
  return L;
}
function forwardSolve(L, b, k) { const x = new Float64Array(k); for (let i = 0; i < k; i++) { let s = b[i]; for (let q = 0; q < i; q++) s -= L[i * k + q] * x[q]; x[i] = s / L[i * k + i]; } return x; }
function backSolveT(L, b, k) { const x = new Float64Array(k); for (let i = k - 1; i >= 0; i--) { let s = b[i]; for (let q = i + 1; q < k; q++) s -= L[q * k + i] * x[q]; x[i] = s / L[i * k + i]; } return x; }

// ---------------------------------------------------------------------------
// State space: level + dummy seasonal (season.duration = 1)
// state a = [level, s_1, ..., s_{S-1}],  Z = [1, 1, 0, ..., 0]
// ---------------------------------------------------------------------------
function makeStateModel(nseasons) {
  const S = nseasons > 1 ? nseasons : 1;
  const m = S > 1 ? S : 1; // 1 + (S - 1)
  const applyT = (v, out) => { // out = T v
    out[0] = v[0];
    if (m > 1) {
      let s = 0; for (let j = 1; j < m; j++) s -= v[j];
      for (let j = m - 1; j >= 2; j--) out[j] = v[j - 1];
      out[1] = s;
    }
    return out;
  };
  const applyTt = (r, out) => { // out = T' r
    out[0] = r[0];
    if (m > 1) { for (let j = 1; j < m; j++) out[j] = -r[1] + (j + 1 < m ? r[j + 1] : 0); }
    return out;
  };
  const zDot = (v) => (m > 1 ? v[0] + v[1] : v[0]);
  return { m, S, applyT, applyTt, zDot };
}

// Kalman filter + backward smoothing recursion (de Jong / Durbin-Koopman fast state smoother).
// y: Float64Array with NaN for missing. q: state disturbance variances [level, seasonal]. h: obs variance.
// Returns smoothed state mean (n*m).
function fastStateSmoother(model, y, a0, P0diag, q, h, yLL = null, a0LL = null) {
  const { m, applyT, applyTt, zDot } = model;
  const n = y.length;
  const V = new Float64Array(n), F = new Float64Array(n), K = new Float64Array(n * m);
  let a = Float64Array.from(a0);
  let P = new Float64Array(m * m);
  for (let i = 0; i < m; i++) P[i * m + i] = P0diag[i];
  const tmpA = new Float64Array(m * m), col = new Float64Array(m), colT = new Float64Array(m), na = new Float64Array(m);
  const pz = new Float64Array(m);
  // optional second series sharing the same gains: log likelihood of the actual data at no extra P cost
  let aL = yLL ? Float64Array.from(a0LL) : null, ll = 0;
  const naL = new Float64Array(m);
  for (let t = 0; t < n; t++) {
    const yt = y[t];
    // T P T'
    for (let j = 0; j < m; j++) { for (let i = 0; i < m; i++) col[i] = P[i * m + j]; applyT(col, colT); for (let i = 0; i < m; i++) tmpA[i * m + j] = colT[i]; }
    const TPT = new Float64Array(m * m);
    for (let i = 0; i < m; i++) { for (let j = 0; j < m; j++) col[j] = tmpA[i * m + j]; applyT(col, colT); for (let j = 0; j < m; j++) TPT[i * m + j] = colT[j]; }
    if (Number.isNaN(yt)) {
      V[t] = 0; F[t] = Infinity;
      applyT(a, na); a = Float64Array.from(na);
      if (aL) { applyT(aL, naL); aL.set(naL); }
      P = TPT;
    } else {
      for (let i = 0; i < m; i++) pz[i] = m > 1 ? P[i * m] + P[i * m + 1] : P[i * m];
      const f = zDot(pz) + h;
      const v = yt - zDot(a);
      applyT(pz, colT); // T P Z'
      for (let i = 0; i < m; i++) K[t * m + i] = colT[i] / f;
      V[t] = v; F[t] = f;
      if (aL) {
        const vL = yLL[t] - zDot(aL);
        ll -= 0.5 * (Math.log(2 * Math.PI * f) + (vL * vL) / f);
        applyT(aL, naL);
        for (let i = 0; i < m; i++) naL[i] += K[t * m + i] * vL;
        aL.set(naL);
      }
      applyT(a, na);
      for (let i = 0; i < m; i++) na[i] += K[t * m + i] * v;
      a = Float64Array.from(na);
      for (let i = 0; i < m; i++) for (let j = 0; j < m; j++) TPT[i * m + j] -= K[t * m + i] * K[t * m + j] * f;
      P = TPT;
    }
    P[0] += q[0];
    if (m > 1) P[m + 1] += q[1];
  }
  // backward
  const rr = new Float64Array((n + 1) * m);
  const rt = new Float64Array(m), tr = new Float64Array(m);
  for (let t = n - 1; t >= 0; t--) {
    for (let i = 0; i < m; i++) rt[i] = rr[(t + 1) * m + i];
    applyTt(rt, tr);
    if (F[t] !== Infinity) {
      let kr = 0; for (let i = 0; i < m; i++) kr += K[t * m + i] * rt[i];
      const c = V[t] / F[t] - kr;
      tr[0] += c; if (m > 1) tr[1] += c;
    }
    for (let i = 0; i < m; i++) rr[t * m + i] = tr[i];
  }
  const alpha = new Float64Array(n * m);
  for (let i = 0; i < m; i++) alpha[i] = a0[i] + P0diag[i] * rr[i];
  const cur = new Float64Array(m), nxt = new Float64Array(m);
  for (let t = 0; t + 1 < n; t++) {
    for (let i = 0; i < m; i++) cur[i] = alpha[t * m + i];
    applyT(cur, nxt);
    nxt[0] += q[0] * rr[(t + 1) * m];
    if (m > 1) nxt[1] += q[1] * rr[(t + 1) * m + 1];
    for (let i = 0; i < m; i++) alpha[(t + 1) * m + i] = nxt[i];
  }
  if (yLL) alpha.logLik = ll;
  return alpha;
}

// Durbin-Koopman (2002) simulation smoother: one draw of the state path given y and parameters.
export function simulationSmoother(model, y, a0, P0diag, q, h, rng) {
  const { m, applyT, zDot } = model;
  const n = y.length;
  const plus = new Float64Array(n * m);
  const yplus = new Float64Array(n);
  const cur = new Float64Array(m), nxt = new Float64Array(m);
  for (let i = 0; i < m; i++) cur[i] = a0[i] + Math.sqrt(P0diag[i]) * rng.normal();
  const sq0 = Math.sqrt(q[0]), sq1 = m > 1 ? Math.sqrt(q[1]) : 0, sh = Math.sqrt(h);
  for (let t = 0; t < n; t++) {
    for (let i = 0; i < m; i++) plus[t * m + i] = cur[i];
    yplus[t] = Number.isNaN(y[t]) ? NaN : zDot(cur) + sh * rng.normal();
    applyT(cur, nxt);
    nxt[0] += sq0 * rng.normal();
    if (m > 1) nxt[1] += sq1 * rng.normal();
    for (let i = 0; i < m; i++) cur[i] = nxt[i];
  }
  const ydiff = new Float64Array(n);
  for (let t = 0; t < n; t++) ydiff[t] = Number.isNaN(y[t]) ? NaN : y[t] - yplus[t];
  const zero = new Float64Array(m);
  const hat = fastStateSmoother(model, ydiff, zero, P0diag, q, h, y, a0);
  for (let k = 0; k < n * m; k++) hat[k] += plus[k];
  return hat; // hat.logLik = log p(y | parameters)
}

// ---------------------------------------------------------------------------
// Spike-and-slab regression (stochastic search variable selection, as BoomSpikeSlab)
// ---------------------------------------------------------------------------
function makeSpikeSlab(Xobs, nobs, p, cfg) {
  // Xobs: array of p Float64Array (observed rows only), standardised
  const XtX = new Float64Array(p * p);
  for (let i = 0; i < p; i++) for (let j = i; j < p; j++) {
    let s = 0; const xi = Xobs[i], xj = Xobs[j];
    for (let t = 0; t < nobs; t++) s += xi[t] * xj[t];
    XtX[i * p + j] = XtX[j * p + i] = s;
  }
  const Omega = new Float64Array(p * p);
  for (let i = 0; i < p; i++) for (let j = 0; j < p; j++) {
    const base = XtX[i * p + j] / nobs;
    Omega[i * p + j] = cfg.priorInformationWeight * (i === j ? base : (1 - cfg.diagonalShrinkage) * base);
  }
  // bsts counts the intercept column when spreading expected.model.size over predictors
  const pi = Math.min(1, cfg.expectedModelSize / (p + 1));
  const df0 = cfg.priorDf;
  const ss0 = cfg.priorDf * (1 - cfg.expectedR2) * cfg.sdy * cfg.sdy;
  return { XtX, Omega, pi, df0, ss0, p };
}

function ssLogPost(ss, gamma, Xtr, rtr, nobs) {
  const { p, XtX, Omega, pi, df0, ss0 } = ss;
  const idx = []; for (let j = 0; j < p; j++) if (gamma[j]) idx.push(j);
  const k = idx.length;
  let lp = 0;
  if (pi < 1) for (let j = 0; j < p; j++) lp += gamma[j] ? Math.log(pi) : Math.log(1 - pi);
  let SS = rtr;
  if (k > 0) {
    const Om = new Float64Array(k * k), Vi = new Float64Array(k * k), b = new Float64Array(k);
    for (let a = 0; a < k; a++) { b[a] = Xtr[idx[a]]; for (let c = 0; c < k; c++) { Om[a * k + c] = Omega[idx[a] * p + idx[c]]; Vi[a * k + c] = Om[a * k + c] + XtX[idx[a] * p + idx[c]]; } }
    const Lo = cholesky(Om, k), Lv = cholesky(Vi, k);
    if (!Lo || !Lv) return { lp: -Infinity };
    let ldo = 0, ldv = 0; for (let a = 0; a < k; a++) { ldo += Math.log(Lo[a * k + a]); ldv += Math.log(Lv[a * k + a]); }
    const w = forwardSolve(Lv, b, k);
    let q = 0; for (let a = 0; a < k; a++) q += w[a] * w[a];
    SS = rtr - q;
    lp += ldo - ldv; // 0.5 log|Om| - 0.5 log|Vi|
    return { lp: lp - 0.5 * (df0 + nobs) * Math.log(ss0 + SS), idx, Lv, w, SS };
  }
  return { lp: lp - 0.5 * (df0 + nobs) * Math.log(ss0 + SS), idx, SS };
}

// One Gibbs update of (gamma, beta, sigma_obs) given residual r (observed rows).
function spikeSlabStep(ss, gamma, Xobs, r, nobs, rng, sigmaUpper) {
  const p = ss.p;
  const Xtr = new Float64Array(p);
  for (let j = 0; j < p; j++) { let s = 0; const x = Xobs[j]; for (let t = 0; t < nobs; t++) s += x[t] * r[t]; Xtr[j] = s; }
  let rtr = 0; for (let t = 0; t < nobs; t++) rtr += r[t] * r[t];
  let cur = ssLogPost(ss, gamma, Xtr, rtr, nobs);
  if (ss.pi < 1) {
    const order = Array.from({ length: p }, (_, j) => j);
    for (let j = p - 1; j > 0; j--) { const u = Math.floor(rng.uniform() * (j + 1)); [order[j], order[u]] = [order[u], order[j]]; }
    for (const j of order) {
      gamma[j] = 1 - gamma[j];
      const alt = ssLogPost(ss, gamma, Xtr, rtr, nobs);
      // Gibbs: P(new) = 1 / (1 + exp(cur - alt))
      const pNew = 1 / (1 + Math.exp(cur.lp - alt.lp));
      if (rng.uniform() < pNew) cur = alt; else gamma[j] = 1 - gamma[j];
    }
  }
  const sigma = drawSigma(rng, 0.5 * (ss.df0 + nobs), 0.5 * (ss.ss0 + Math.max(cur.SS, 0)), sigmaUpper);
  const beta = new Float64Array(p);
  if (cur.idx && cur.idx.length) {
    const k = cur.idx.length;
    const z = new Float64Array(k); for (let a = 0; a < k; a++) z[a] = cur.w[a] + sigma * rng.normal();
    const bk = backSolveT(cur.Lv, z, k); // beta = Vi^{-1} Xtr + sigma * L^{-T} e
    for (let a = 0; a < k; a++) beta[cur.idx[a]] = bk[a];
  }
  return { beta, sigma };
}


// Log likelihood log p(y | parameters) by the prediction error decomposition (bsts log.likelihood).
function kalmanLogLik(model, y, a0, P0diag, q, h) {
  const { m, applyT, zDot } = model;
  let a = Float64Array.from(a0), P = new Float64Array(m * m);
  for (let i = 0; i < m; i++) P[i * m + i] = P0diag[i];
  const col = new Float64Array(m), colT = new Float64Array(m), tmp = new Float64Array(m * m), pz = new Float64Array(m), na = new Float64Array(m);
  let ll = 0;
  for (let t = 0; t < y.length; t++) {
    const TPT = new Float64Array(m * m);
    for (let j = 0; j < m; j++) { for (let i = 0; i < m; i++) col[i] = P[i * m + j]; applyT(col, colT); for (let i = 0; i < m; i++) tmp[i * m + j] = colT[i]; }
    for (let i = 0; i < m; i++) { for (let j = 0; j < m; j++) col[j] = tmp[i * m + j]; applyT(col, colT); for (let j = 0; j < m; j++) TPT[i * m + j] = colT[j]; }
    applyT(a, na);
    if (!Number.isNaN(y[t])) {
      for (let i = 0; i < m; i++) pz[i] = m > 1 ? P[i * m] + P[i * m + 1] : P[i * m];
      const f = zDot(pz) + h, v = y[t] - zDot(a);
      ll -= 0.5 * (Math.log(2 * Math.PI * f) + (v * v) / f);
      applyT(pz, colT);
      for (let i = 0; i < m; i++) { const k = colT[i] / f; na[i] += k * v; for (let j = 0; j < m; j++) TPT[i * m + j] -= k * colT[j]; }
    }
    a = Float64Array.from(na); P = TPT;
    P[0] += q[0]; if (m > 1) P[m + 1] += q[1];
  }
  return ll;
}

// bsts::SuggestBurn: discard `proportion` of the draws, and at least every draw before the log
// likelihood first reaches the 10% quantile of its post-burn-in values.
export function suggestBurn(proportion, logLik) {
  const niter = logLik.length;
  let burn = Math.floor(proportion * niter);
  if (burn > 0) {
    const sorted = Float64Array.from(logLik.subarray(burn)).sort();
    const thr = quantile(sorted, 0.1);
    let first = 0; while (first < niter && logLik[first] < thr) first++;
    burn = Math.max(burn, first);
  }
  return burn;
}

// ---------------------------------------------------------------------------
// BSTS Gibbs sampler on (already standardised) data
// ---------------------------------------------------------------------------
export function fitBsts({ y, X = [], nseasons = 7, priorLevelSd = 0.01, niter = 1000, burnProportion = 0.1, seed = 1, cfg = {} }) {
  const c = { ...DEFAULTS, ...cfg };
  const n = y.length, p = X.length;
  const rng = makeRng(seed);
  const model = makeStateModel(nseasons);
  const m = model.m;
  const obsIdx = []; for (let t = 0; t < n; t++) if (!Number.isNaN(y[t])) obsIdx.push(t);
  const nobs = obsIdx.length;
  let mean = 0; for (const t of obsIdx) mean += y[t]; mean /= nobs;
  let v = 0; for (const t of obsIdx) v += (y[t] - mean) ** 2;
  const sdy = Math.sqrt(v / (nobs - 1)) || 1;
  const y1 = y[obsIdx[0]];
  const a0 = new Float64Array(m); a0[0] = y1;
  const P0 = new Float64Array(m).fill(sdy * sdy);
  // priors
  const lvl = { df: c.levelPriorSampleSize, ss: c.levelPriorSampleSize * (priorLevelSd * sdy) ** 2, upper: sdy };
  const sea = { df: 0.01, ss: 0.01 * (0.01 * sdy) ** 2, upper: sdy };
  const obsPrior = { df: 0.01, ss: 0.01 * sdy * sdy, upper: 1.2 * sdy };
  const Xobs = X.map((col) => Float64Array.from(obsIdx, (t) => col[t]));
  const ss = p ? makeSpikeSlab(Xobs, nobs, p, { ...c, sdy }) : null;
  // init
  let sigLevel = priorLevelSd * sdy, sigSeas = 0.01 * sdy, sigObs = p ? Math.sqrt(1 - c.expectedR2) * sdy : sdy;
  let beta = new Float64Array(p);
  const gamma = new Uint8Array(p).fill(ss && ss.pi >= 1 ? 1 : 0);
  // all draws are stored, burn-in is chosen afterwards as bsts::SuggestBurn does
  const allContrib = new Float64Array(n * niter); // [t * niter + it]
  const allSigObs = new Float64Array(niter), allSigLevel = new Float64Array(niter), allSigSeas = new Float64Array(niter);
  const allBetas = new Float64Array(niter * p);
  const logLik = new Float64Array(niter);
  const reg = new Float64Array(n);
  const yeff = new Float64Array(n);
  const r = new Float64Array(nobs);
  for (let it = 0; it < niter; it++) {
    for (let t = 0; t < n; t++) {
      let s = 0; for (let j = 0; j < p; j++) if (beta[j] !== 0) s += beta[j] * X[j][t];
      reg[t] = s;
      yeff[t] = Number.isNaN(y[t]) ? NaN : y[t] - s;
    }
    const q = [sigLevel * sigLevel, sigSeas * sigSeas];
    const alpha = simulationSmoother(model, yeff, a0, P0, q, sigObs * sigObs, rng);
    // state variances
    let e0 = 0, e1 = 0;
    for (let t = 0; t + 1 < n; t++) {
      const d0 = alpha[(t + 1) * m] - alpha[t * m];
      e0 += d0 * d0;
      if (m > 1) { let s = alpha[(t + 1) * m + 1]; for (let j = 1; j < m; j++) s += alpha[t * m + j]; e1 += s * s; }
    }
    sigLevel = drawSigma(rng, 0.5 * (lvl.df + n - 1), 0.5 * (lvl.ss + e0), lvl.upper);
    if (m > 1) sigSeas = drawSigma(rng, 0.5 * (sea.df + n - 1), 0.5 * (sea.ss + e1), sea.upper);
    // regression + observation variance
    for (let k = 0; k < nobs; k++) { const t = obsIdx[k]; r[k] = y[t] - model.zDot(alpha.subarray(t * m, t * m + m)); }
    if (p) {
      const res = spikeSlabStep(ss, gamma, Xobs, r, nobs, rng, 1.2 * sdy);
      beta = res.beta; sigObs = res.sigma;
    } else {
      let e = 0; for (let k = 0; k < nobs; k++) e += r[k] * r[k];
      sigObs = drawSigma(rng, 0.5 * (obsPrior.df + nobs), 0.5 * (obsPrior.ss + e), obsPrior.upper);
    }
    for (let t = 0; t < n; t++) {
      let s = 0; for (let j = 0; j < p; j++) if (beta[j] !== 0) s += beta[j] * X[j][t];
      allContrib[t * niter + it] = model.zDot(alpha.subarray(t * m, t * m + m)) + s;
    }
    allSigObs[it] = sigObs; allSigLevel[it] = sigLevel; allSigSeas[it] = sigSeas;
    for (let j = 0; j < p; j++) allBetas[it * p + j] = beta[j];
    logLik[it] = alpha.logLik; // log likelihood at the parameters used for this state draw
  }
  const burn = suggestBurn(burnProportion, logLik);
  const keep = niter - burn;
  const contrib = new Float64Array(n * keep);
  for (let t = 0; t < n; t++) contrib.set(allContrib.subarray(t * niter + burn, (t + 1) * niter), t * keep);
  return {
    n, p, keep, burn, contrib, logLik, rng,
    sigmaObs: allSigObs.slice(burn), sigmaLevel: allSigLevel.slice(burn), sigmaSeas: allSigSeas.slice(burn),
    betas: allBetas.slice(burn * p),
  };
}

// ---------------------------------------------------------------------------
// Statistics helpers
// ---------------------------------------------------------------------------
export function quantile(sorted, prob) { // R type 7 on a sorted array
  const n = sorted.length; if (!n) return NaN;
  const h = (n - 1) * prob, lo = Math.floor(h), hi = Math.ceil(h);
  return sorted[lo] + (h - lo) * (sorted[hi] - sorted[lo]);
}
const meanOf = (a) => { let s = 0; for (const v of a) s += v; return s / a.length; };
const sdOf = (a) => { const mu = meanOf(a); let s = 0; for (const v of a) s += (v - mu) ** 2; return Math.sqrt(s / (a.length - 1)); };

// ---------------------------------------------------------------------------
// CausalImpact on index ranges
// ---------------------------------------------------------------------------
// y: number[] (response, full series), X: { name: number[] } covariates aligned on y
// pre = [i0, i1], post = [j0, j1] inclusive indices, i0 <= i1 < j0 <= j1
export function causalImpact({ y, X = {}, pre, post, options = {} }) {
  const o = { ...DEFAULTS, ...options };
  const [i0, i1] = pre, [j0, j1] = post;
  if (!(i0 <= i1 && i1 < j0 && j0 <= j1)) throw new Error('Invalid periods: pre-period must end before post-period starts.');
  const n = j1 - i0 + 1;
  const names = Object.keys(X);
  const nPre = i1 - i0 + 1;
  const yRaw = Float64Array.from({ length: n }, (_, k) => +y[i0 + k]);
  // standardisation on the pre-period
  const preVals = Array.from(yRaw.subarray(0, nPre)).filter((v) => Number.isFinite(v));
  if (preVals.length < 3) throw new Error('Pre-period has fewer than 3 observed points.');
  const muY = o.standardize ? meanOf(preVals) : 0;
  const sdY = o.standardize ? (sdOf(preVals) || 1) : 1;
  const ys = new Float64Array(n);
  for (let k = 0; k < n; k++) ys[k] = k < nPre && Number.isFinite(yRaw[k]) ? (yRaw[k] - muY) / sdY : NaN;
  const used = [], dropped = [], Xs = [], scale = {};
  for (const name of names) {
    const col = Float64Array.from({ length: n }, (_, k) => +X[name][i0 + k]);
    if (col.some((v) => !Number.isFinite(v))) { dropped.push({ name, reason: 'missing values' }); continue; }
    const pv = Array.from(col.subarray(0, nPre));
    const mu = meanOf(pv), sd = sdOf(pv);
    if (!(sd > 1e-12)) { dropped.push({ name, reason: 'constant over the pre-period' }); continue; }
    const m = o.standardize ? mu : 0, s = o.standardize ? sd : 1;
    Xs.push(col.map((v) => (v - m) / s)); used.push(name); scale[name] = { mean: mu, sd };
  }
  const fit = fitBsts({ y: ys, X: Xs, nseasons: o.nseasons, priorLevelSd: o.priorLevelSd, niter: o.niter, burnProportion: o.burnProportion, seed: o.seed, cfg: o });
  const { keep, contrib, sigmaObs, rng } = fit;
  // posterior predictive samples on the original scale: [t * keep + d]
  const samples = new Float64Array(n * keep);
  for (let t = 0; t < n; t++) for (let d = 0; d < keep; d++) samples[t * keep + d] = (contrib[t * keep + d] + sigmaObs[d] * rng.normal()) * sdY + muY;
  const a = o.alpha;
  const series = [];
  const col = new Float64Array(keep);
  for (let t = 0; t < n; t++) {
    for (let d = 0; d < keep; d++) col[d] = samples[t * keep + d];
    const mean = meanOf(col);
    const sorted = Float64Array.from(col).sort();
    series.push({ index: i0 + t, actual: yRaw[t], pred: mean, predLower: quantile(sorted, a / 2), predUpper: quantile(sorted, 1 - a / 2), period: t < nPre ? 'pre' : (i0 + t >= j0 ? 'post' : 'gap') });
  }
  // post-period aggregates
  const postT = []; for (let t = 0; t < n; t++) if (i0 + t >= j0) postT.push(t);
  const nPost = postT.length;
  const sums = new Float64Array(keep);
  for (const t of postT) for (let d = 0; d < keep; d++) sums[d] += samples[t * keep + d];
  // cumulative effect series (post only)
  let cumActual = 0; const cumSamples = new Float64Array(keep);
  for (const t of postT) {
    const s = series[t];
    s.effect = s.actual - s.pred; s.effectLower = s.actual - s.predUpper; s.effectUpper = s.actual - s.predLower;
    cumActual += s.actual;
    for (let d = 0; d < keep; d++) cumSamples[d] += samples[t * keep + d];
    const cs = Float64Array.from(cumSamples).sort();
    const cm = meanOf(cumSamples);
    s.cumEffect = cumActual - cm; s.cumEffectLower = cumActual - quantile(cs, 1 - a / 2); s.cumEffectUpper = cumActual - quantile(cs, a / 2);
  }
  for (let t = 0; t < n; t++) if (series[t].period !== 'post') { const s = series[t]; s.effect = s.actual - s.pred; s.effectLower = s.actual - s.predUpper; s.effectUpper = s.actual - s.predLower; }
  const actualPost = postT.map((t) => yRaw[t]);
  if (actualPost.some((v) => !Number.isFinite(v))) throw new Error('Post-period response contains missing values.');
  const summary = summarise(actualPost, sums, postT.map((t) => series[t].pred), a);
  // inclusion probabilities, coefficients (standardised and original scale)
  const covariates = used.map((name, j) => {
    let inc = 0, sumB = 0;
    for (let d = 0; d < keep; d++) { const b = fit.betas[d * fit.p + j]; if (b !== 0) { inc++; sumB += b; } }
    const mb = inc ? sumB / inc : 0;
    return { name, inclusionProb: inc / keep, coefStd: mb, coefOriginal: o.standardize ? mb * sdY / scale[name].sd : mb };
  });
  // in-sample fit diagnostics (posterior mean vs actual over pre-period)
  const preFit = fitStats(series.filter((s) => s.period === 'pre'));
  return {
    engine: ENGINE_VERSION, options: o, pre, post, nPre, nPost,
    covariatesUsed: used, covariatesDropped: dropped, covariates,
    series, summary, preFit,
    posteriorSamplesPostSum: sums,
    burnIn: fit.burn,
    sigma: { obs: meanOf(fit.sigmaObs) * sdY, level: meanOf(fit.sigmaLevel) * sdY, seasonal: meanOf(fit.sigmaSeas) * sdY },
  };
}

// Summary table and tail probability, CausalImpact::CompileSummaryTable / ComputeCumulativePredictions
export function summarise(actualPost, sampleSums, pointPredPost, alpha = 0.05) {
  const nPost = actualPost.length;
  const yPostSum = actualPost.reduce((s, v) => s + v, 0);
  const predSum = pointPredPost.reduce((s, v) => s + v, 0);
  const sorted = Float64Array.from(sampleSums).sort();
  const lo = quantile(sorted, alpha / 2), hi = quantile(sorted, 1 - alpha / 2);
  const sdSum = sdOf(sampleSums);
  let ge = 1, le = 1; // the observed value is included, as in R
  for (const s of sampleSums) { if (s >= yPostSum) ge++; if (s <= yPostSum) le++; }
  const pValue = Math.min(ge, le) / (sampleSums.length + 1);
  // relative effect computed draw by draw, as CausalImpact >= 1.2: actual / prediction - 1
  const rel = Float64Array.from(sampleSums, (sv) => yPostSum / sv - 1);
  const relSorted = Float64Array.from(rel).sort();
  const relBlock = { relEffect: meanOf(rel), relEffectLower: quantile(relSorted, alpha / 2), relEffectUpper: quantile(relSorted, 1 - alpha / 2), relEffectSd: sdOf(rel) };
  const block = (actual, pred, pl, pu, psd) => ({
    actual, pred, predLower: pl, predUpper: pu, predSd: psd,
    absEffect: actual - pred, absEffectLower: actual - pu, absEffectUpper: actual - pl, absEffectSd: psd,
    ...relBlock,
  });
  return {
    average: block(yPostSum / nPost, predSum / nPost, lo / nPost, hi / nPost, sdSum / nPost),
    cumulative: block(yPostSum, predSum, lo, hi, sdSum),
    pValue, probCausal: 1 - pValue, alpha,
    intervalExcludesZero: (yPostSum - hi > 0) || (yPostSum - lo < 0),
  };
}

// Re-read a fitted window with the observed post-period scaled by (1 + uplift).
// Valid because the post-period response never enters the fit.
export function rescoreWithUplift(result, uplift) {
  const post = result.series.filter((s) => s.period === 'post');
  const actual = post.map((s) => s.actual * (1 + uplift));
  return summarise(actual, result.posteriorSamplesPostSum, post.map((s) => s.pred), result.options.alpha);
}

export function fitStats(rows) {
  const ok = rows.filter((s) => Number.isFinite(s.actual));
  if (!ok.length) return null;
  let ape = 0, nApe = 0, inside = 0, err = 0, sumA = 0;
  for (const s of ok) {
    if (s.actual !== 0) { ape += Math.abs((s.actual - s.pred) / s.actual); nApe++; }
    if (s.actual >= s.predLower && s.actual <= s.predUpper) inside++;
    err += s.actual - s.pred; sumA += s.actual;
  }
  return { n: ok.length, mape: nApe ? ape / nApe : NaN, coverage: inside / ok.length, bias: err / sumA };
}

// ---------------------------------------------------------------------------
// 4.1 Hold-out fit: train up to the last `validationLength` points of the pre-period, predict them.
export function holdoutValidation({ y, X, pre, validationLength, options = {} }) {
  const [i0, i1] = pre;

// Placebo windows of length L, walking back from the end of the pre-period.
export function placeboWindows({ pre, postLength, count, minPreLength, exclude = [] }) {

    xh.setAttribute('x1', xs(i)); xh.setAttribute('x2', xs(i)); xh.setAttribute('visibility', 'visible');
    const rows = sp.tip(i).filter((t) => t);
    tip.innerHTML = `<b>${esc(fDate(sp.dates[i]))}</b>` + rows.map(([k, v]) => `<div>${esc(k)}: ${esc(v)}</div>`).join('');
    tip.hidden = false;
    const tw = tip.offsetWidth; tip.style.left = `${Math.min(W - tw - 4, Math.max(4, xs(i) + 12 + tw > W ? xs(i) - tw - 12 : xs(i) + 12))}px`; tip.style.top = `${m.t + 4}px`;

function spark(a, iv, i0 = 0, i1 = a.length - 1) {
  const W = 150, H = 28; const seg = a.slice(i0, i1 + 1); const fin = seg.filter(isNum);
  if (!fin.length) return '';
  const lo = Math.min(...fin), hi = Math.max(...fin), rg = hi - lo || 1; const n = seg.length;
  const pts = seg.map((v, k) => (isNum(v) ? `${((k * W) / Math.max(1, n - 1)).toFixed(1)},${(H - 2 - ((v - lo) * (H - 4)) / rg).toFixed(1)}` : null)).filter(Boolean).join(' ');
  const x = iv >= i0 && iv <= i1 ? (((iv - i0) * W) / Math.max(1, n - 1)).toFixed(1) : null;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.2" vector-effect="non-scaling-stroke"/>${x ? `<line class="iv" x1="${x}" x2="${x}" y1="0" y2="${H}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>` : ''}</svg>`;
}

function protocolFlags() {
  const out = []; if (!S.data) return out;
  const p = periods(); const sel = selected();
  if (!p.ok) { out.push(['warn', L('Periods are incomplete or inconsistent.', 'Périodes incomplètes ou incohérentes.')]); return out; }
  out.push(p.nPre >= 3 * p.nPost ? ['pass', L(`Pre-period ${p.nPre} days, at least 3 × post-period (${3 * p.nPost} days).`, `Pré-période de ${p.nPre} jours, au moins 3 × la post-période (${3 * p.nPost} jours).`)] : ['warn', L(`Pre-period ${p.nPre} days, shorter than 3 × post-period (${3 * p.nPost} days).`, `Pré-période de ${p.nPre} jours, plus courte que 3 × la post-période (${3 * p.nPost} jours).`)]);
  if (p.nPre < 56) out.push(['warn', L(`Pre-period shorter than 8 weeks (${p.nPre} days).`, `Pré-période de moins de 8 semaines (${p.nPre} jours).`)]);
  if (p.gap > 0) out.push(['info', L(`${p.gap} day${p.gap > 1 ? 's' : ''} between pre-period end and intervention left out of the fit.`, `${p.gap} jour${p.gap > 1 ? 's' : ''} entre la fin de la pré-période et l'intervention, hors ajustement.`)]);
  if (!S.design.weekly) out.push(['info', L('Weekly seasonality off on daily data.', 'Saisonnalité hebdomadaire désactivée sur des données journalières.')]);
  const kq = qc().cols[S.design.kpi];
  const kpiMiss = S.data.cols[S.design.kpi].slice(p.i0, p.j1 + 1).filter((v) => !isNum(v)).length;
  if (kpiMiss) out.push(['warn', L(`KPI has ${kpiMiss} missing values inside the analysis range.`, `Le KPI a ${kpiMiss} valeur${kpiMiss > 1 ? 's' : ''} manquante${kpiMiss > 1 ? 's' : ''} dans la plage d'analyse.`)]);
  if (kq && kq.spikes && kq.spikes.some((i) => i >= p.i0 && i <= p.j1)) out.push(['info', L('KPI has isolated spikes inside the analysis range: explain them in the notes.', "Le KPI présente des pics isolés dans la plage d'analyse : à expliquer dans les notes.")]);
  if (sel.length) out.push(sel.length > p.nPre / 10 ? ['warn', L(`${sel.length} covariates for ${p.nPre} pre-period points (guideline: 1 per 10 points).`, `${sel.length} covariables pour ${p.nPre} points de pré-période (repère : 1 pour 10 points).`)] : ['pass', L(`${sel.length} covariates for ${p.nPre} pre-period points.`, `${sel.length} covariable${sel.length > 1 ? 's' : ''} pour ${p.nPre} points de pré-période.`)]);
  else out.push(['info', L('No covariate selected: the counterfactual is a local level model.', 'Aucune covariable retenue : le contrefactuel est un modèle de niveau local.')]);
  const by = (s) => sel.filter((n) => S.covs[n].status === s);
  if (by('Exposed').length) out.push(['warn', L(`Exposed covariates retained (H-A): ${by('Exposed').join(', ')}.`, `Covariables exposées retenues (H-A) : ${by('Exposed').join(', ')}.`)]);
  if (by('Doubtful').length) out.push(['info', L(`Doubtful covariates retained, to clear in sensitivity: ${by('Doubtful').join(', ')}.`, `Covariables douteuses retenues, à lever en sensibilité : ${by('Doubtful').join(', ')}.`)]);
  const nr = by('Not reviewed').length;
  if (nr) out.push(['info', L(`H-A status not reviewed for ${nr} retained covariate${nr > 1 ? 's' : ''}.`, `Statut H-A non revu pour ${nr} covariable${nr > 1 ? 's' : ''} retenue${nr > 1 ? 's' : ''}.`)]);
  const v = valCfg(p);
  if (v.valPre[0] !== p.i0) out.push(['info', L(`Validation history starts on ${fDate(S.data.dates[v.valPre[0]])}, not at the pre-period start.`, `L'historique de validation commence le ${fDate(S.data.dates[v.valPre[0]])}, pas au début de la pré-période.`)]);
  if (v.relaxed) out.push(['warn', L(`Placebo rule relaxed: windows of ${v.L} days (post-period ${p.nPost}), at least ${v.minHist} days of history (rule ${v.rule})${S.val.overlap ? `, overlapping every ${v.stride} days` : ''}.`, `Règle des placebos assouplie : fenêtres de ${v.L} jours (post-période ${p.nPost}), au moins ${v.minHist} jours d'historique (règle ${v.rule})${S.val.overlap ? `, chevauchement tous les ${v.stride} jours` : ''}.`)]);
  if (v.wins.length < 4) { const w = v.wins.length; out.push(['warn', L(`${w} placebo window${w === 1 ? '' : 's'} fit the history (protocol: at least 4).`, `${w} fenêtre${w > 1 ? 's' : ''} placebo dans l'historique (protocole : au moins 4).`)]); }
  const fresh = (r) => r && r.sig === sigVal();
  if (fresh(R.holdout)) { const h = R.holdout.out; out.push(h.mape > 0.1 ? ['warn', L(`Hold-out MAPE ${pct(h.mape, 1, false)} (guideline: under 10%), bias ${pct(h.bias)}.`, `MAPE du hold-out ${pct(h.mape, 1, false)} (repère : moins de 10 %), biais ${pct(h.bias)}.`)] : ['pass', L(`Hold-out MAPE ${pct(h.mape, 1, false)}, bias ${pct(h.bias)}.`, `MAPE du hold-out ${pct(h.mape, 1, false)}, biais ${pct(h.bias)}.`)]); }
  else out.push(['info', L('Hold-out not run on the current settings.', 'Hold-out non lancé sur les réglages actuels.')]);
  if (fresh(R.placebo)) {
    const pl = R.placebo.out; const k = pl.nRobust, n = pl.nWindows;
    const frTxt = `${k} placebo${k > 1 ? 's' : ''} robuste${k > 1 ? 's' : ''} sur ${n} (seuil : 1 sur 5).`;
    if (n) out.push(pl.falsePositiveShare > 0.2 ? ['warn', L(`${k} of ${n} placebos robust (threshold: 1 in 5). The protocol does not read the effect.`, `${frTxt} Le protocole ne lit pas l'effet.`)] : ['pass', L(`${k} of ${n} placebos robust (threshold: 1 in 5).`, frTxt)]);
  }
  else out.push(['info', L('Placebos not run on the current settings.', 'Placebos non lancés sur les réglages actuels.')]);
  return out;
}

async function runHoldout() {

  const out = await job('Hold-out', 'holdout', { y: S.data.cols[S.design.kpi], X: Xof(selected()), pre: [p.i0, p.i1], validationLength: L0, options: modelOptions() });
  if (out) { R.holdout = { sig, out }; render(); }
}
async function runPlacebos() {
  const p = periods(); const c = valCfg(p); if (!c.wins.length) return;

}

    holdout: h && { n: h.n, mape: h.mape, coverage: h.coverage, bias: h.bias },
    placebo: pl && { n: pl.nWindows, robust: pl.nRobust, mde: pl.mde, mdeAtGridFloor: pl.mdeAtGridFloor },
    flags: protocolFlagsIn('en'), flagsFr: protocolFlagsIn('fr'), go: S.sheet.go, correction: S.sheet.correction, notes: S.sheet.notes,

}
function diffSnap(a, b) {
  const out = [];
  for (const k of ['kpi', 'preStart', 'preEnd', 'intervention', 'postEnd', 'weekly', 'prior', 'niter', 'seed']) if (String(a.design[k]) !== String(b.design[k])) out.push(`${k}: ${a.design[k]} → ${b.design[k]}`);
  const sa = Object.keys(a.covs).filter((n) => a.covs[n].on), sb = Object.keys(b.covs).filter((n) => b.covs[n].on);
  const add = sb.filter((n) => !sa.includes(n)), rem = sa.filter((n) => !sb.includes(n));
  if (add.length) out.push(`covariates added: ${add.join(', ')}`); if (rem.length) out.push(`covariates removed: ${rem.join(', ')}`);
  for (const k of ['holdout', 'valStart', 'L', 'minHist', 'overlap', 'step', 'count']) if (String(a.val[k]) !== String(b.val[k])) out.push(`validation ${k}: ${a.val[k]} → ${b.val[k]}`);
  if (a.hash !== b.hash) out.push('data changed');
  return out;
}

const HDB = 'ci-tool-history', HSTORE = 'tests', HFORMAT = 'causal-impact-history';
let hdbP = null;
function hdb() {
  if (!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB unavailable'));
  return (hdbP = hdbP || new Promise((ok, ko) => {
    let rq; try { rq = indexedDB.open(HDB, 1); } catch (e) { hdbP = null; ko(e); return; }
    rq.onupgradeneeded = () => rq.result.createObjectStore(HSTORE, { keyPath: 'id' });
    rq.onsuccess = () => ok(rq.result);
    rq.onerror = () => { hdbP = null; ko(rq.error || new Error('IndexedDB refused')); };
  }));
}
async function hTx(mode, fn) {
  const db = await hdb();
  return new Promise((ok, ko) => {
    const tx = db.transaction(HSTORE, mode); const st = tx.objectStore(HSTORE); let out;
    const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => ok(out); tx.onerror = () => ko(tx.error); tx.onabort = () => ko(tx.error || new Error('aborted'));
  });
}
const histAll = () => hTx('readonly', (st) => st.getAll()).then((a) => (a || []).sort((x, y) => (x.savedAt < y.savedAt ? 1 : -1)));
const histGet = (id) => hTx('readonly', (st) => st.get(id));

function resultOf() {

    saveFile(`causal-impact-history_${isoDay()}.json`, new Blob([JSON.stringify(doc)], { type: 'application/json' }));
  } catch (e) { toast(L('This browser does not give access to the history.', "Ce navigateur ne donne pas accès à l'historique.")); }
}
async function histImport(file) {
  let doc;
  try { doc = JSON.parse(await file.text()); } catch (e) { status(L('Import failed: the file is not valid JSON.', "Échec de l'import : le fichier n'est pas un JSON valide."), null, false); return; }
  if (!doc || doc.format !== HFORMAT || !Array.isArray(doc.tests)) { status(L('Import failed: this is not a Causal Impact history file.', "Échec de l'import : ce n'est pas un fichier d'historique Causal Impact."), null, false); return; }
  let added = 0, updated = 0, kept = 0, bad = 0;
  try {
    const have = new Map((await histAll()).map((x) => [x.id, x]));
    for (const t of doc.tests) {
      if (!t || typeof t.id !== 'string' || !t.state || !t.state.data || !t.state.sheet || !t.state.sheet.frozen) { bad++; continue; }
      const cur = have.get(t.id);
      if (!cur) { await histPutRaw(t); added++; }
      else if ((t.savedAt || '') > (cur.savedAt || '')) { await histPutRaw(t); updated++; }
      else kept++;
    }
  } catch (e) { status(L('Import failed: this browser does not give access to the history.', "Échec de l'import : ce navigateur ne donne pas accès à l'historique."), null, false); return; }
  status(L(`History imported: ${added} added, ${updated} updated, ${kept} already up to date${bad ? `, ${bad} unreadable entr${bad > 1 ? 'ies' : 'y'} skipped` : ''}.`, `Historique importé : ${added} ajouté${added > 1 ? 's' : ''}, ${updated} mis à jour, ${kept} déjà à jour${bad ? `, ${bad} entrée${bad > 1 ? 's' : ''} illisible${bad > 1 ? 's' : ''} ignorée${bad > 1 ? 's' : ''}` : ''}.`), null, false, true);
  vHistory();
}

let openArmed = null;
function bindHist() {
  $('#hExport').addEventListener('click', histExport);
  const fi = $('#hImport'); fi.addEventListener('change', () => { if (fi.files[0]) histImport(fi.files[0]); fi.value = ''; });
  $$('[data-hopen]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.hopen;
    const unsaved = S.data && !frozen() && id !== S.id;
    if (unsaved && openArmed !== id) { openArmed = id; b.textContent = L('Click again: current draft lost', 'Cliquez à nouveau : brouillon en cours perdu'); setTimeout(() => { if (openArmed === id) { openArmed = null; b.textContent = L('Reopen', 'Rouvrir'); } }, 4000); return; }
    openArmed = null; histOpen(id);

  $$('[data-hdel]').forEach((b) => b.addEventListener('click', async () => {

  }));
}

const README = {

  <h3 id="rm-what">What the tool does</h3>
  <p>Causal Impact estimates what a KPI would have done without an intervention (a campaign, a new channel, a price change) and measures the gap with what really happened. Over a pre-period, the model learns how the KPI moves together with control series, the covariates, that the intervention cannot touch. It then projects that relationship over the post-period. The gap between observed and predicted is the effect, given with a 95% interval.</p>
  <p>Everything runs in your browser: imported data is not sent to any server. The engine reproduces the defaults of the R package CausalImpact (Brodersen et al., 2015).</p>

  <li><b>Validation.</b> Run the hold-out and the placebos before reading any effect. Targets: hold-out MAPE under 10%, coverage close to 95%, at most 1 placebo in 5 robust, at least 4 placebo windows. The MDE gives the smallest effect the set-up can detect. If validation fails, change covariates or periods now.</li>

  ['data', ['Wide format', 'One row per day, one date column and one column per series. The tool expects this layout.'], ['Format large', "Une ligne par jour, une colonne de dates et une colonne par série. C'est la forme attendue par l'outil."]],
  ['data', ['Pre-period', 'Days before the intervention on which the model learns the relationship between the KPI and the covariates. Protocol: at least 3 × the post-period and at least 8 weeks in daily data.'], ['Pré-période', "Jours avant l'intervention sur lesquels le modèle apprend la relation entre le KPI et les covariables. Protocole : au moins 3 × la post-période et au moins 8 semaines en journalier."]],
  ['data', ['Intervention date', 'First day of real exposure to the action, not the booking or approval date. The post-period starts on that day.'], ["Date d'intervention", "Premier jour d'exposition réelle à l'action, pas la date de réservation ou de validation. La post-période commence ce jour-là."]],
  ['data', ['Post-period', 'Days on which the effect is measured, from the intervention to the post-period end. The KPI must have no missing value there.'], ['Post-période', "Jours sur lesquels l'effet est mesuré, de l'intervention à la fin de la post-période. Le KPI ne doit y avoir aucune valeur manquante."]],
  ['data', ['Left-out days (ramp-up)', 'Days between the end of the pre-period and the intervention, kept out of the fit: teasing, technical test, progressive launch.'], ['Jours écartés (montée en charge)', "Jours entre la fin de la pré-période et l'intervention, tenus hors de l'ajustement : teasing, test technique, lancement progressif."]],
  ['data', ['Isolated spike', 'Value that sits more than 4 robust standard deviations away from the centred 7-day moving median. The robust standard deviation is 1.4826 × the median absolute deviation (MAD) of those gaps.'], ['Pic isolé', "Valeur qui s'écarte de plus de 4 écarts-types robustes de la médiane mobile centrée sur 7 jours. L'écart-type robuste vaut 1,4826 × l'écart absolu médian (MAD) de ces écarts."]],
  ['data', ['Data fingerprint', 'Short code computed from the dates and values at import. Stored in the frozen test sheet, it shows which data the test was run on.'], ['Empreinte des données', "Code court calculé à l'import à partir des dates et des valeurs. Stockée dans la fiche figée, elle montre sur quelles données le test a tourné."]],
  ['covs', ['Covariate (control series)', 'A series that moves with the KPI but that the intervention cannot affect: category searches, competitor activity, weather, an unexposed region. The model uses covariates to build the counterfactual.'], ['Covariable (série témoin)', "Une série qui évolue avec le KPI mais que l'intervention ne peut pas toucher : recherches de catégorie, activité concurrente, météo, zone non exposée. Le modèle s'en sert pour construire le contrefactuel."]],
  ['covs', ['H-A and H-B', 'The two assumptions the result rests on. H-A: no covariate is touched by the intervention. H-B: the relationship learnt on the pre-period still holds on the post-period. No tool can check them; the protocol makes them visible.'], ['H-A et H-B', "Les deux hypothèses qui portent le résultat. H-A : aucune covariable n'est touchée par l'intervention. H-B : la relation apprise en pré-période tient pendant la post-période. Aucun outil ne les vérifie ; le protocole les rend visibles."]],
  ['covs', ['H-A status', 'Answer, covariate by covariate, to the question: can the intervention move this series? Intact: no plausible mechanism. Doubtful: possible but weak mechanism, kept only if removing it in sensitivity does not change the conclusion. Exposed: direct mechanism, to leave out.'], ['Statut H-A', "Réponse, covariable par covariable, à la question : l'intervention peut-elle faire bouger cette série ? Intacte : aucun mécanisme plausible. Douteuse : mécanisme possible mais faible, gardée seulement si son retrait en sensibilité ne change pas la conclusion. Exposée : mécanisme direct, à écarter."]],
  ['covs', ['Covariate category', 'Market demand, competition, seasonality, regulatory and macro, alternative channel, brand. Alternative channel and brand series carry the highest risk of being exposed to a visibility campaign.'], ['Catégorie de covariable', 'Demande marché, concurrence, saisonnalité, réglementaire et macro, canal alternatif, marque. Les séries canal alternatif et marque sont les plus exposées à une campagne de visibilité.']],
  ['covs', ['Post / pre ratio', 'Mean of a series over the post-period divided by its mean over the pre-period. A covariate whose ratio sits more than 20% away from the median of all columns may have been moved by the intervention or by another event.'], ['Ratio post / pré', "Moyenne d'une série sur la post-période divisée par sa moyenne sur la pré-période. Une covariable dont le ratio s'écarte de plus de 20 % de la médiane de toutes les colonnes a pu être poussée par l'intervention ou par un autre événement."]],
  ['covs', ['Pre-period correlation', 'Pearson correlation between a covariate and the KPI over the pre-period. A high value helps the fit but does not prove the covariate is unexposed.'], ['Corrélation en pré-période', "Corrélation de Pearson entre une covariable et le KPI sur la pré-période. Une valeur élevée aide l'ajustement mais ne prouve pas que la covariable est intacte."]],
  ['covs', ['One covariate per 10 points', 'Guideline on list size: no more covariates than one per 10 pre-period days. Beyond it, filter the list before the model.'], ['Une covariable pour 10 points', 'Repère sur la taille de la liste : pas plus d\'une covariable pour 10 jours de pré-période. Au-delà, filtrer la liste avant le modèle.']],
  ['model', ['Local level', 'Model component that lets the baseline of the KPI drift slowly from day to day (a random walk).'], ['Niveau local', "Composante du modèle qui laisse la base du KPI dériver lentement d'un jour à l'autre (marche aléatoire)."]],
  ['model', ['Weekly seasonality', 'Seven-day component that captures the day-of-week pattern. On by default for daily data.'], ['Saisonnalité hebdomadaire', 'Composante sur sept jours qui capte le profil par jour de semaine. Activée par défaut en journalier.']],
  ['model', ['Level prior', 'Prior on how fast the local level can drift. 0.01 suits stable series; 0.1 allows more drift and gives wider intervals. Used when in doubt.'], ['Prior de niveau', 'A priori sur la vitesse de dérive du niveau local. 0,01 convient aux séries stables ; 0,1 autorise plus de dérive et donne des intervalles plus larges. À utiliser en cas de doute.']],
  ['model', ['Spike-and-slab', 'Prior on the regression that lets each covariate be switched on or off from one draw to the next. It sorts the covariates; the inclusion probability shows the result.'], ['Spike-and-slab', "A priori sur la régression qui permet d'activer ou non chaque covariable d'un tirage à l'autre. Il trie les covariables ; la probabilité d'inclusion en montre le résultat."]],
  ['model', ['Static regression', 'Covariate coefficients are constant over the whole period, as in the default R CausalImpact model.'], ['Régression statique', 'Les coefficients des covariables sont constants sur toute la période, comme dans le modèle par défaut de R CausalImpact.']],
  ['model', ['Standardisation', 'Each series is centred and scaled on the pre-period before the fit, then results are brought back to the original scale.'], ['Standardisation', "Chaque série est centrée et réduite sur la pré-période avant l'ajustement, puis les résultats reviennent à l'échelle d'origine."]],
  ['model', ['Iterations', 'Number of posterior draws. More iterations give steadier interval bounds and take longer.'], ['Itérations', "Nombre de tirages a posteriori. Plus d'itérations donnent des bornes d'intervalle plus stables et prennent plus de temps."]],
  ['model', ['Burn-in', 'First draws thrown away while the sampler settles. The engine chooses it as R does.'], ['Burn-in', "Premiers tirages écartés le temps que l'échantillonneur se stabilise. Le moteur le choisit comme R."]],
  ['model', ['Seed', 'Starting point of the random number generator. Same data, same settings and same seed give the same result; it is stored in the test sheet.'], ['Seed', 'Point de départ du générateur aléatoire. Mêmes données, mêmes réglages et même seed donnent le même résultat ; il est noté dans la fiche de test.']],
  ['model', ['Posterior σ', 'Estimated standard deviations, in original units, of the observation noise, the level drift and the seasonal drift.'], ['σ a posteriori', "Écarts-types estimés, en unités d'origine, du bruit d'observation, de la dérive du niveau et de la dérive saisonnière."]],
  ['val', ['Hold-out', 'The model is trained without the last days of the pre-period (21 by default) and predicts them. Nothing happened on those days, so the prediction should match the observed series.'], ['Hold-out', 'Le modèle est entraîné sans les derniers jours de la pré-période (21 par défaut) et les prédit. Rien ne s\'est passé ces jours-là : la prédiction doit coller à l\'observé.']],
  ['val', ['MAPE', 'Mean absolute percentage error between observed and predicted values. Guideline on the hold-out: under 10%.'], ['MAPE', "Erreur absolue moyenne en pourcentage entre valeurs observées et prédites. Repère sur le hold-out : moins de 10 %."]],
  ['val', ['Coverage', 'Share of observed points that fall inside the 95% interval. Close to 95% when the model is well calibrated.'], ['Couverture', "Part des points observés qui tombent dans l'intervalle à 95 %. Proche de 95 % quand le modèle est bien calibré."]],
  ['val', ['Bias', 'Sum of (observed − predicted) divided by the sum of observed values. A clear positive or negative bias means the model systematically under- or over-predicts.'], ['Biais', "Somme des écarts (observé − prédit) divisée par la somme de l'observé. Un biais net, positif ou négatif, signale un modèle qui sous-prédit ou surprédit de façon systématique."]],
  ['val', ['Placebo', 'Fake intervention date placed inside the pre-period, analysed as if it were real. A robust effect on a placebo is a false positive.'], ['Placebo', "Fausse date d'intervention placée dans la pré-période et analysée comme si elle était réelle. Un effet robuste sur un placebo est un faux positif."]],
  ['val', ['False positive rate', 'Share of placebos that come out robust. Protocol threshold: 1 in 5. Above it, the protocol does not read the effect.'], ['Taux de faux positifs', "Part des placebos qui ressortent robustes. Seuil du protocole : 1 sur 5. Au-delà, le protocole ne lit pas l'effet."]],
  ['val', ['Placebo window and minimum history', 'Placebo windows have the length of the post-period by default. The engine rule asks for max(3 × length, 56) days of history before each window. Relaxing it (shorter windows, less history, overlap) is written in the test sheet.'], ['Fenêtre placebo et historique minimum', "Les fenêtres placebo ont par défaut la durée de la post-période. La règle du moteur exige max(3 × durée, 56) jours d'historique avant chaque fenêtre. Tout assouplissement (fenêtres plus courtes, moins d'historique, chevauchement) s'inscrit dans la fiche de test."]],
  ['val', ['Power', 'Probability of detecting an effect of a given size. Estimated by injecting uplifts of 5, 10, 15 and 20% into the placebo windows and counting how often they are detected.'], ['Puissance', "Probabilité de détecter un effet d'une taille donnée. Estimée en injectant des uplifts de 5, 10, 15 et 20 % dans les fenêtres placebo et en comptant combien de fois ils sont détectés."]],
  ['val', ['MDE (minimum detectable effect)', 'Smallest injected uplift detected in at least 8 windows out of 10. Detected means confidence ≥ 95% and a cumulative lower bound above zero. An effect smaller than the MDE can exist without being seen.'], ['MDE (effet minimum détectable)', "Plus petit uplift injecté détecté dans au moins 8 fenêtres sur 10. Détecté signifie confiance ≥ 95 % et borne basse cumulée au-dessus de zéro. Un effet plus petit que la MDE peut exister sans être vu."]],
  ['res', ['Absolute effect', 'Observed minus predicted, in KPI units: per day for the average, summed over the post-period for the cumulative.'], ['Effet absolu', 'Observé moins prédit, en unités du KPI : par jour pour la moyenne, sommé sur la post-période pour le cumul.']],
  ['res', ['Relative effect (uplift)', 'Observed divided by predicted, minus one, computed draw by draw as in CausalImpact 1.2 and later. Shown as a percentage.'], ['Effet relatif (uplift)', 'Observé divisé par prédit, moins un, calculé tirage par tirage comme dans CausalImpact 1.2 et suivants. Affiché en pourcentage.']],
  ['res', ['Pointwise and cumulative effect', 'Pointwise: the gap day by day. Cumulative: the sum of the gaps since the intervention, with its own interval.'], ['Effet ponctuel et cumulé', "Ponctuel : l'écart jour par jour. Cumulé : la somme des écarts depuis l'intervention, avec son propre intervalle."]],
  ['res', ['95% interval', 'Range that holds 95% of the posterior draws (a credible interval). Its lower bound is the prudent reading of the effect.'], ['Intervalle à 95 %', "Plage qui contient 95 % des tirages a posteriori (intervalle de crédibilité). Sa borne basse est la lecture prudente de l'effet."]],
  ['res', ['Posterior tail-area probability (p)', 'Share of draws whose predicted sum is at least as extreme as the observed sum. A low p means the observed result is unlikely without an effect.'], ['Probabilité a posteriori de queue (p)', "Part des tirages dont la somme prédite est au moins aussi extrême que la somme observée. Un p faible signifie que l'observé est peu probable sans effet."]],
  ['res', ['Confidence (probability of a causal effect)', 'Equal to 1 − p. It places the result on the confidence grid.'], ["Confiance (probabilité d'un effet causal)", 'Égale à 1 − p. Elle place le résultat sur la grille de confiance.']],
  ['res', ['Confidence grid', 'Robust: ≥ 95% and 95% interval excludes zero. Favorable: ≥ 90%. Trend: 70% to 90%. Inconclusive: under 70%. A legend for reading, not a verdict.'], ['Grille de confiance', 'Robuste : ≥ 95 % et intervalle à 95 % hors zéro. Favorable : ≥ 90 %. Tendance : de 70 à 90 %. Non concluant : moins de 70 %. Une légende de lecture, pas un verdict.']],
  ['res', ['Inclusion probability', 'Share of posterior draws in which a covariate is used by the model. Close to 1: the covariate carries the counterfactual.'], ["Probabilité d'inclusion", "Part des tirages a posteriori où le modèle utilise une covariable. Proche de 1 : la covariable porte le contrefactuel."]],
  ['res', ['Coefficient (standardised, original scale)', 'Average weight of a covariate when it is included. Standardised: on centred and scaled series. Original scale: in KPI units per unit of the covariate.'], ["Coefficient (standardisé, échelle d'origine)", "Poids moyen d'une covariable quand elle est incluse. Standardisé : sur séries centrées réduites. Échelle d'origine : en unités du KPI par unité de la covariable."]],
  ['res', ['Business threshold', 'Smallest uplift worth acting on, set before the analysis and compared with the lower bound of the interval.'], ['Seuil business', "Plus petit uplift qui justifie d'agir, fixé avant l'analyse et comparé à la borne basse de l'intervalle."]],
  ['res', ['Sensitivity', 'The analysis rerun with the debatable choices changed: other level prior, seasonality switched, one covariate removed at a time (leave-one-out), later pre-period start. When a variant crosses a grid threshold, read at the most prudent level.'], ['Sensibilité', "L'analyse relancée en changeant les choix discutables : autre prior de niveau, saisonnalité inversée, retrait d'une covariable à la fois, début de pré-période plus tardif. Quand une variante franchit un seuil de la grille, lire au niveau le plus prudent."]],
  ['proto', ['Test sheet', 'The protocol sheet, filled in from the previous steps: framing, periods, covariates, model, validation, reading criteria. It is completed before the effect is seen.'], ['Fiche de test', "La fiche du protocole, remplie à partir des étapes précédentes : cadrage, périodes, covariables, modèle, validation, critères de lecture. Elle se termine avant de voir l'effet."]],
  ['proto', ['Freeze', 'Locks the settings, stamps the time and the data fingerprint, unlocks the analysis and saves the test to History. The reading criteria are fixed before the result is known.'], ['Figer', "Verrouille les réglages, horodate la fiche, enregistre l'empreinte des données, débloque l'analyse et ajoute le test à l'historique. Les critères de lecture sont fixés avant de connaître le résultat."]],
  ['proto', ['Deviation log', 'Record of every amendment after a freeze: date, reason, and the parameters changed at the next freeze.'], ['Journal des écarts', 'Trace de chaque amendement après un gel : date, motif et paramètres modifiés au gel suivant.']],
  ['proto', ['Go / No-go', 'Decision recorded before the analysis: are the test conditions met? A No-go comes with the correction to make.'], ['Go / No-go', "Décision notée avant l'analyse : les conditions du test sont-elles réunies ? Un No-go s'accompagne de la correction à apporter."]],
  ['proto', ['H0 and H1', 'H0: the intervention has no effect on the KPI. H1: it has one, and the statement says what the effect is independent of (seasonality, market demand, competition).'], ['H0 et H1', "H0 : l'intervention n'a pas d'effet sur le KPI. H1 : elle en a un, et l'énoncé précise ce dont l'effet est indépendant (saisonnalité, demande marché, concurrence)."]],
  ['proto', ['Confounding events', 'Other events in the pre- or post-period that could move the KPI: promotion, outage, press coverage, price change, tracking change.'], ['Événements parasites', 'Autres événements en pré- ou post-période qui peuvent faire bouger le KPI : promotion, panne, couverture presse, changement de prix, changement de tracking.']],
  ['proto', ['Tracking prerequisites', 'Conditions on measurement to check before the test: stable conversion definitions, gap between media and CRM figures, tags unchanged over the period.'], ['Prérequis tracking', 'Conditions de mesure à vérifier avant le test : définitions de conversion stables, écart entre chiffres média et CRM, tags inchangés sur la période.']],
  ['proto', ['Stale', 'A result computed on older settings. Run it again before reading it.'], ['À relancer', 'Un résultat calculé sur des réglages antérieurs. Relancez-le avant de le lire.']],
];
function bindJumps() { $$('[data-jump]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); const t = document.getElementById(a.dataset.jump); if (t) t.scrollIntoView({ block: 'start' }); })); }
function vReadme() { view.innerHTML = `<div class="doc">${README[LANG]}</div>`; bindJumps(); }
function vGlossary() {
  const k = LANG === 'fr' ? 2 : 1; const nrm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const groups = GLOSSARY_GROUPS.map(([g, en, fr]) => {
    const items = GLOSSARY.filter((x) => x[0] === g).map((x) => x[k]).sort((a, b) => a[0].localeCompare(b[0], LANG));
    return `<section class="gl-group" data-g="${g}"><h3 id="gl-${g}">${L(en, fr)}</h3><dl class="gl">${items.map(([t, d]) => `<div class="gl-item" data-s="${esc(nrm(t + ' ' + d))}"><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl></section>`;
  }).join('');
  view.innerHTML = `<div class="doc"><h2>${L('Glossary', 'Lexique')}</h2><p class="lead">${L('The notions used by the tool and the protocol, grouped by theme. The <a href="#readme">Read me</a> shows them in the order of a test.', 'Les notions utilisées par l\'outil et le protocole, regroupées par thème. Le <a href="#readme">mode d\'emploi</a> les présente dans l\'ordre d\'un test.')}</p>
  <div class="row"><input type="text" id="glq" placeholder="${esc(L('Filter terms', 'Filtrer les notions'))}" aria-label="${esc(L('Filter terms', 'Filtrer les notions'))}" style="max-width:360px"><span class="small muted" id="gln"></span></div>
  <nav class="toc">${GLOSSARY_GROUPS.map(([g, en, fr]) => `<a href="#glossary" data-jump="gl-${g}">${L(en, fr)}</a>`).join('')}</nav>${groups}</div>`;
  bindJumps();
  const q = $('#glq'), n = $('#gln');
  const apply = () => {
    const v = nrm(q.value.trim()); let shown = 0;
    $$('.gl-item').forEach((it) => { const ok = !v || it.dataset.s.includes(v); it.hidden = !ok; if (ok) shown++; });
    $$('.gl-group').forEach((s) => { s.hidden = !s.querySelector('.gl-item:not([hidden])'); });
    n.textContent = v ? L(`${shown} term${shown > 1 ? 's' : ''}`, `${shown} notion${shown > 1 ? 's' : ''}`) : '';
  };
  q.addEventListener('input', apply);
}

let newArmed = false;
$('#newTest').addEventListener('click', () => {
  if (!newArmed) { newArmed = true; $('#newTest').textContent = L('Click again to confirm', 'Cliquez à nouveau pour confirmer'); setTimeout(() => { newArmed = false; $('#newTest').textContent = L('New test', 'Nouveau test'); }, 3000); return; }
  newArmed = false; $('#newTest').textContent = L('New test', 'Nouveau test');
  const data = S.data; S = fresh(); if (data) { S.data = data; S.design.kpi = data.names[0]; S.design.preStart = data.dates[0]; S.design.postEnd = data.dates[data.dates.length - 1]; for (const n of data.names) S.covs[n] = { on: false, cat: '', status: 'Not reviewed' }; }
  clearResults(); save(); location.hash = 'data'; render();
});

render();
}

</script>
